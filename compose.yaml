name: wealthcopilot

services:
  mysql:
    image: mysql:8.0
    container_name: wealthcopilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wealthcopilot}
      MYSQL_USER: ${MYSQL_USER:-wealthcopilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wealthcopilot_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-wealthcopilot_root_dev}
      TZ: UTC
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - wealthcopilot_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  wealthcopilot_mysql_data:
