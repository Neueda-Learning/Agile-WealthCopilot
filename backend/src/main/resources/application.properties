market-data.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
market-data.api-key=${TWELVE_DATA_API_KEY:}
market-data.connect-timeout=${MARKET_DATA_CONNECT_TIMEOUT:3s}
market-data.read-timeout=${MARKET_DATA_READ_TIMEOUT:5s}
market-data.cache-ttl=${MARKET_DATA_CACHE_TTL:15m}
market-data.search-cache-ttl=${MARKET_DATA_SEARCH_CACHE_TTL:10m}
market-data.search-cache-size=${MARKET_DATA_SEARCH_CACHE_SIZE:500}
market-data.credits-per-minute=${MARKET_DATA_CREDITS_PER_MINUTE:8}
market-data.max-attempts=${MARKET_DATA_MAX_ATTEMPTS:3}
market-data.retry-initial-backoff=${MARKET_DATA_RETRY_INITIAL_BACKOFF:250ms}
market-data.max-retry-after=${MARKET_DATA_MAX_RETRY_AFTER:5s}
market-data.market-zone=${MARKET_DATA_MARKET_ZONE:America/New_York}
